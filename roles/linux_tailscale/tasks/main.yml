---
- name: Ensure OS family is supported by this role
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "tailscale role currently supports Debian-family systems only."

- name: Determine Tailscale repository family and codename from facts
  ansible.builtin.set_fact:
    linux_tailscale_repo_family: "{{ 'ubuntu' if (ansible_facts['distribution'] | lower == 'ubuntu') else 'debian' }}"
    linux_tailscale_repo_codename: "{{ ansible_facts['distribution_release'] | lower }}"

- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ linux_tailscale_repo_family }}/{{ linux_tailscale_repo_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  become: true

- name: Ensure python3-debian is installed for deb822 support
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
  become: true

- name: Add Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "https://pkgs.tailscale.com/stable/{{ linux_tailscale_repo_family }}"
    suites: "{{ linux_tailscale_repo_codename }}"
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  become: true

- name: Enable and start Tailscale
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
  become: true

- name: Check for existing Tailscale state
  ansible.builtin.stat:
    path: "{{ linux_tailscale_state_file }}"
  register: linux_tailscale_state_stat
  become: true

- name: Ensure Tailscale auth key is available when needed
  ansible.builtin.assert:
    that:
      - linux_tailscale_auth_key is defined
      - linux_tailscale_auth_key | length > 0
    fail_msg: >-
      linux_tailscale_auth_key is missing. Provide it via Infisical in
      group_vars/secrets.yml at deploy time.
  when:
    - linux_tailscale_run_up | bool
    - not linux_tailscale_state_stat.stat.exists or linux_tailscale_force_reauth | bool

- name: Set up Tailscale auth # noqa no-changed-when
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--authkey=' + linux_tailscale_auth_key] + linux_tailscale_up_args }}"
  register: linux_tailscale_up
  changed_when: true
  no_log: true
  become: true
  when:
    - linux_tailscale_run_up | bool
    - linux_tailscale_auth_key is defined
    - linux_tailscale_auth_key | length > 0
    - not linux_tailscale_state_stat.stat.exists or linux_tailscale_force_reauth | bool

- name: Wait for Tailscale IP after up
  ansible.builtin.command: tailscale ip -4
  register: linux_tailscale_ip_after
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: linux_tailscale_ip_after.stdout != ''
  when: linux_tailscale_run_up | bool
