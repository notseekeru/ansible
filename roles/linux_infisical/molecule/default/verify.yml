---
- name: Verify linux_infisical role
  hosts: all
  vars_files:
    - ../../../defaults/main.yml

  tasks:
    - name: Ensure Infisical CLI is in PATH
      ansible.builtin.command: which infisical
      register: linux_infisical_which
      changed_when: false
      failed_when: linux_infisical_which.rc != 0

    - name: Ensure Infisical CLI binary is executable
      ansible.builtin.stat:
        path: /usr/local/bin/infisical
      register: linux_infisical_bin

    - name: Assert Infisical binary present and executable
      ansible.builtin.assert:
        that:
          - linux_infisical_bin.stat.exists
          - linux_infisical_bin.stat.mode == '0755'

    - name: Ensure Infisical CLI runs
      ansible.builtin.command: infisical --version
      register: linux_infisical_version_out
      changed_when: false
      failed_when: linux_infisical_version_out.rc != 0
