---
# Authenticate the Infisical CLI as a machine identity via universal auth.
# client-id/client-secret must be supplied via vault-encrypted group_vars,
# never inline plaintext in inventory. no_log suppresses values from output.
- name: Login Infisical CLI via universal auth
  ansible.builtin.command:
    argv:
      - infisical
      - login
      - --method=universal-auth
      - --client-id={{ infisical_client_id }}
      - --client-secret={{ infisical_client_secret }}
      - --plain
  become: true
  no_log: true
  register: infisical_login
  changed_when: infisical_login.rc == 0
